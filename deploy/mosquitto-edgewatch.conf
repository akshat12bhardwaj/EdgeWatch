# Example gateway broker config. The IDS needs nothing from it: it watches packets and never connects to the broker.
# Plaintext is required for MQTT features: under TLS a passive observer loses all mqtt.* fields (ADR-08).
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
log_type error
log_type warning
