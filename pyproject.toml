[project]
name = "edgewatch"
version = "0.1.0"
description = "Passive MQTT intrusion detection on an edge gateway"
requires-python = ">=3.11"
# Live gateway path: decoder and extractor are standard library. These are for inference, API and metrics.
dependencies = ["scikit-learn>=1.5", "joblib>=1.4", "numpy>=1.26", "psutil>=5.9", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[project.optional-dependencies]
offline = ["pandas>=2.2", "pyarrow>=15"]
dev = ["pytest>=8", "httpx>=0.27"]
wokwi = ["pyserial>=3.5"]  # RFC2217 client for the Wokwi serial bridge (lab/home.py)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ids*", "lab*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: needs a real broker or capture on this machine"]
