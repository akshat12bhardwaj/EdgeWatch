; Edge Watch virtual smart home: one simulated ESP32 for Wokwi for VS Code. Build: pio run -e esp32dev (from this folder).
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx@^1.19

; Default and free: structured serial lines, relayed to MQTT by `python -m lab.home serial-bridge` over Wokwi's RFC2217 port.
[env:esp32dev]

; Direct MQTT over Wokwi WiFi to host.wokwi.internal. Needs the Private IoT Gateway (Wokwi paid plans) and include/secrets.h.
; To use it, build with `pio run -e esp32dev-wifi` and point wokwi.toml at .pio/build/esp32dev-wifi/.
[env:esp32dev-wifi]
build_flags = -DEW_WIFI_MQTT
lib_deps =
  ${env.lib_deps}
  knolleary/PubSubClient@^2.8
